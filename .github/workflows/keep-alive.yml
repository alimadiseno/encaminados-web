name: Keep Supabase awake

# El plan gratuito de Supabase pausa la base de datos tras 7 días sin
# actividad. Este workflow visita un endpoint liviano del sitio cada 3
# días para que esa actividad nunca se acumule.
on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping encaminados.cl/api/ping
        run: curl -fsS https://encaminados.cl/api/ping
